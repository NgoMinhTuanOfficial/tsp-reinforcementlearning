[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-active-search"
version = "0.1.0"
description = "Per-instance Active Search for TSPLIB TSP instances using a Pointer Network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "notebook>=7.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
tsp-active-search = "tsp_active_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
